[project]
name = "superwebsearch-mcp"
version = "0.1.0"
description = "MCP server for SuperWebsearch via the 6551 API"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.25,<2",
    "httpx>=0.27",
]

[project.scripts]
superwebsearch-mcp = "superwebsearch_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/superwebsearch_mcp"]

